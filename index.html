<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赌场管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: linear-gradient(90deg, #2d132c 0%, #801336 50%, #c72c41 100%);
            padding: 20px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .nav {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #ffd700;
            color: #2d132c;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page {
            display: none;
            animation: fadeIn 0.5s;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }

        .stat-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #aaa;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #ffd700 0%, #ffed4e 100%);
            color: #2d132c;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-danger {
            background: linear-gradient(90deg, #c72c41 0%, #ee4545 100%);
            color: #fff;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(199, 44, 65, 0.4);
        }

        .btn-success {
            background: linear-gradient(90deg, #28a745 0%, #34ce57 100%);
            color: #fff;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th, table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        table th {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            font-weight: bold;
        }

        table tr:hover {
            background: rgba(255, 215, 0, 0.05);
        }

        table input {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        .chip-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .chip-color {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin-right: 15px;
        }

        .chip-info {
            flex: 1;
        }

        .chip-name {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .chip-value {
            font-size: 14px;
            color: #aaa;
        }

        .chip-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chip-quantity input {
            width: 100px;
            padding: 8px;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-details {
            padding: 15px;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 24px;
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .product-actions .btn {
            flex: 1;
            padding: 8px;
            font-size: 14px;
        }

        .game-placeholder {
            text-align: center;
            padding: 100px 20px;
        }

        .game-placeholder .icon {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .game-placeholder h2 {
            font-size: 36px;
            color: #ffd700;
            margin-bottom: 20px;
        }

        .game-placeholder p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid #ffd700;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .modal-header h3 {
            color: #ffd700;
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-btn:hover {
            color: #c72c41;
            transform: rotate(90deg);
        }

        .image-upload-area {
            border: 2px dashed rgba(255, 215, 0, 0.5);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .image-upload-area:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        .image-upload-area img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        .total-bar {
            background: linear-gradient(90deg, #2d132c 0%, #801336 100%);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #ffd700;
        }

        .total-bar .total-label {
            font-size: 20px;
            color: #ffd700;
        }

        .total-bar .total-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
        }

        .save-status {
            color: #28a745;
            line-height: 44px;
            display: none;
            animation: fadeInOut 2s ease-in-out;
        }

        .save-status.show {
            display: inline-block;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .auto-save-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(40, 167, 69, 0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            animation: slideIn 0.3s ease-out;
            z-index: 999;
        }

        .auto-save-indicator.show {
            display: block;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">赌场管理系统</div>
        <div class="nav">
            <button class="nav-btn active" onclick="showPage('home')">主页面</button>
            <button class="nav-btn" onclick="showPage('chips')">筹码管理</button>
            <button class="nav-btn" onclick="showPage('products')">商品界面</button>
            <button class="nav-btn" onclick="showPage('games')">游戏界面</button>
        </div>
    </div>

    <div class="container">
        <div id="home" class="page active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-value" id="totalChips">0</div>
                    <div class="stat-label">筹码总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💎</div>
                    <div class="stat-value" id="totalValue">¥0</div>
                    <div class="stat-label">总价值</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎁</div>
                    <div class="stat-value" id="totalProducts">0</div>
                    <div class="stat-label">商品数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎮</div>
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label">游戏数量</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">快速操作</div>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="showPage('chips')">管理筹码</button>
                    <button class="btn btn-success" onclick="openProductModal()">添加商品</button>
                    <button class="btn btn-primary" onclick="exportAllData()">📤 导出数据</button>
                    <button class="btn btn-success" onclick="document.getElementById('importFileInput').click()">📥 导入数据</button>
                    <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importAllData(event)">
                    <button class="btn btn-danger" onclick="resetAll()">重置数据</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">最近活动</div>
                <div id="activityLog">
                    <p style="color: #aaa; text-align: center; padding: 20px;">暂无活动记录</p>
                </div>
            </div>
        </div>

        <div id="chips" class="page">
            <div class="card">
                <div class="card-title">筹码数量管理</div>
                <div id="chipsList"></div>
                <div class="total-bar">
                    <div class="total-label">筹码总价值</div>
                    <div class="total-value" id="chipsTotalValue">¥0</div>
                </div>
                <div style="margin-top: 20px; display: flex; gap: 10px; align-items: center;">
                    <button class="btn btn-success" onclick="saveChipsAndItems()">💾 保存筹码数据</button>
                    <span id="chipsSaveStatus" class="save-status">✓ 已保存</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">物品汇总</div>
                <table>
                    <thead>
                        <tr>
                            <th>物品名称</th>
                            <th>数量</th>
                            <th>单价</th>
                            <th>总价</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTable"></tbody>
                </table>
                <div style="margin-top: 20px; display: flex; gap: 10px; align-items: center;">
                    <button class="btn btn-primary" onclick="addItem()">添加物品</button>
                    <button class="btn btn-success" onclick="saveChipsAndItems()">💾 保存物品数据</button>
                    <span id="itemsSaveStatus" class="save-status">✓ 已保存</span>
                </div>
            </div>
        </div>

        <div id="products" class="page">
            <div class="card">
                <div class="card-title">商品管理</div>
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 20px;">
                    <button class="btn btn-success" onclick="openProductModal()">添加商品</button>
                    <button class="btn btn-success" onclick="saveProducts()">💾 保存商品数据</button>
                    <span id="productsSaveStatus" class="save-status">✓ 已保存</span>
                </div>
                <div class="product-grid" id="productsGrid"></div>
            </div>
        </div>

        <div id="games" class="page">
            <div class="game-placeholder">
                <div class="icon">🎲</div>
                <h2>游戏界面</h2>
                <p>游戏功能正在开发中，敬请期待...</p>
                <button class="btn btn-primary" onclick="showPage('home')">返回首页</button>
            </div>
        </div>
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加商品</h3>
                <button class="close-btn" onclick="closeProductModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>商品名称</label>
                <input type="text" id="productName" placeholder="请输入商品名称">
            </div>
            <div class="form-group">
                <label>商品价格</label>
                <input type="number" id="productPrice" placeholder="请输入商品价格">
            </div>
            <div class="form-group">
                <label>商品描述</label>
                <textarea id="productDesc" rows="3" placeholder="请输入商品描述"></textarea>
            </div>
            <div class="form-group">
                <label>商品图片</label>
                <div class="image-upload-area" id="imageUploadArea" onclick="document.getElementById('productImage').click()">
                    <div id="uploadPlaceholder">
                        <div style="font-size: 48px; margin-bottom: 10px;">📷</div>
                        <div>点击上传图片</div>
                    </div>
                    <img id="imagePreview" style="display: none;">
                </div>
                <input type="file" id="productImage" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="saveProduct()">保存</button>
                <button class="btn btn-danger" onclick="closeProductModal()">取消</button>
            </div>
        </div>
    </div>

    <div class="auto-save-indicator" id="autoSaveIndicator">
        💾 自动保存中...
    </div>

    <script>
        const defaultChips = [
            { id: 1, name: '白色筹码', value: 1, quantity: 1000, color: '#ffffff' },
            { id: 2, name: '红色筹码', value: 5, quantity: 500, color: '#c72c41' },
            { id: 3, name: '蓝色筹码', value: 10, quantity: 300, color: '#0066cc' },
            { id: 4, name: '绿色筹码', value: 25, quantity: 200, color: '#28a745' },
            { id: 5, name: '黑色筹码', value: 100, quantity: 100, color: '#333333' },
            { id: 6, name: '紫色筹码', value: 500, quantity: 50, color: '#800080' },
            { id: 7, name: '金色筹码', value: 1000, quantity: 20, color: '#ffd700' }
        ];

        const defaultItems = [
            { id: 1, name: '扑克牌', quantity: 50, price: 20 },
            { id: 2, name: '骰子', quantity: 30, price: 15 },
            { id: 3, name: '轮盘', quantity: 5, price: 500 }
        ];

        let chips = [];
        let items = [];
        let products = [];
        let editingProductId = null;
        let currentImageData = null;

        function loadData() {
            const savedChips = localStorage.getItem('casino_chips');
            const savedItems = localStorage.getItem('casino_items');
            const savedProducts = localStorage.getItem('casino_products');

            chips = savedChips ? JSON.parse(savedChips) : JSON.parse(JSON.stringify(defaultChips));
            items = savedItems ? JSON.parse(savedItems) : JSON.parse(JSON.stringify(defaultItems));
            products = savedProducts ? JSON.parse(savedProducts) : [];
        }

        function saveChipsAndItems() {
            try {
                localStorage.setItem('casino_chips', JSON.stringify(chips));
                localStorage.setItem('casino_items', JSON.stringify(items));
                showSaveStatus('chipsSaveStatus');
                showSaveStatus('itemsSaveStatus');
                showAutoSaveIndicator('筹码和物品数据已保存');
            } catch (e) {
                alert('保存失败：' + e.message);
            }
        }

        function saveProducts() {
            try {
                localStorage.setItem('casino_products', JSON.stringify(products));
                showSaveStatus('productsSaveStatus');
                showAutoSaveIndicator('商品数据已保存');
            } catch (e) {
                alert('保存失败：' + e.message);
            }
        }

        function showSaveStatus(elementId) {
            const element = document.getElementById(elementId);
            element.classList.add('show');
            setTimeout(() => {
                element.classList.remove('show');
            }, 2000);
        }

        function showAutoSaveIndicator(message) {
            const indicator = document.getElementById('autoSaveIndicator');
            indicator.textContent = '✓ ' + message;
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 2000);
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            event.target.classList.add('active');
            updateDashboard();
        }

        function updateDashboard() {
            const totalChips = chips.reduce((sum, c) => sum + c.quantity, 0);
            const totalValue = chips.reduce((sum, c) => sum + (c.quantity * c.value), 0);
            
            document.getElementById('totalChips').textContent = totalChips.toLocaleString();
            document.getElementById('totalValue').textContent = '¥' + totalValue.toLocaleString();
            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('totalGames').textContent = '0';
        }

        function renderChips() {
            const container = document.getElementById('chipsList');
            container.innerHTML = chips.map(chip => `
                <div class="chip-item">
                    <div class="chip-color" style="background: ${chip.color}"></div>
                    <div class="chip-info">
                        <div class="chip-name">${chip.name}</div>
                        <div class="chip-value">面值: ¥${chip.value}</div>
                    </div>
                    <div class="chip-quantity">
                        <input type="number" value="${chip.quantity}" min="0" onchange="updateChipQuantity(${chip.id}, this.value)">
                    </div>
                </div>
            `).join('');
            updateChipsTotal();
        }

        function updateChipQuantity(id, value) {
            const chip = chips.find(c => c.id === id);
            if (chip) {
                chip.quantity = parseInt(value) || 0;
                updateChipsTotal();
                updateDashboard();
            }
        }

        function updateChipsTotal() {
            const total = chips.reduce((sum, c) => sum + (c.quantity * c.value), 0);
            document.getElementById('chipsTotalValue').textContent = '¥' + total.toLocaleString();
        }

        function renderItems() {
            const tbody = document.getElementById('itemsTable');
            tbody.innerHTML = items.map(item => `
                <tr>
                    <td><input type="text" value="${item.name}" onchange="updateItem(${item.id}, 'name', this.value)"></td>
                    <td><input type="number" value="${item.quantity}" min="0" onchange="updateItem(${item.id}, 'quantity', this.value)"></td>
                    <td><input type="number" value="${item.price}" min="0" onchange="updateItem(${item.id}, 'price', this.value)"></td>
                    <td>¥${(item.quantity * item.price).toLocaleString()}</td>
                    <td><button class="btn btn-danger" onclick="deleteItem(${item.id})">删除</button></td>
                </tr>
            `).join('');
        }

        function updateItem(id, field, value) {
            const item = items.find(i => i.id === id);
            if (item) {
                item[field] = field === 'name' ? value : (parseInt(value) || 0);
                renderItems();
            }
        }

        function addItem() {
            const newItem = {
                id: Date.now(),
                name: '新物品',
                quantity: 0,
                price: 0
            };
            items.push(newItem);
            renderItems();
        }

        function deleteItem(id) {
            if (confirm('确定要删除这个物品吗？')) {
                items = items.filter(i => i.id !== id);
                renderItems();
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = '<p style="color: #aaa; text-align: center; grid-column: 1/-1; padding: 50px;">暂无商品，点击"添加商品"开始添加</p>';
                return;
            }
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        ${product.image ? `<img src="${product.image}" alt="${product.name}">` : '<div style="color: #aaa; font-size: 48px;">📷</div>'}
                    </div>
                    <div class="product-details">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">¥${product.price}</div>
                        <div style="color: #aaa; font-size: 14px; margin-bottom: 10px;">${product.desc || '暂无描述'}</div>
                        <div class="product-actions">
                            <button class="btn btn-primary" onclick="editProduct(${product.id})">编辑</button>
                            <button class="btn btn-danger" onclick="deleteProduct(${product.id})">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openProductModal(productId = null) {
            editingProductId = productId;
            currentImageData = null;
            
            if (productId) {
                const product = products.find(p => p.id === productId);
                document.getElementById('modalTitle').textContent = '编辑商品';
                document.getElementById('productName').value = product.name;
                document.getElementById('productPrice').value = product.price;
                document.getElementById('productDesc').value = product.desc || '';
                if (product.image) {
                    currentImageData = product.image;
                    document.getElementById('imagePreview').src = product.image;
                    document.getElementById('imagePreview').style.display = 'block';
                    document.getElementById('uploadPlaceholder').style.display = 'none';
                }
            } else {
                document.getElementById('modalTitle').textContent = '添加商品';
                document.getElementById('productName').value = '';
                document.getElementById('productPrice').value = '';
                document.getElementById('productDesc').value = '';
                document.getElementById('imagePreview').style.display = 'none';
                document.getElementById('uploadPlaceholder').style.display = 'block';
            }
            
            document.getElementById('productModal').classList.add('active');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.remove('active');
            editingProductId = null;
            currentImageData = null;
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageData = e.target.result;
                    document.getElementById('imagePreview').src = currentImageData;
                    document.getElementById('imagePreview').style.display = 'block';
                    document.getElementById('uploadPlaceholder').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        function saveProduct() {
            const name = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value) || 0;
            const desc = document.getElementById('productDesc').value;

            if (!name) {
                alert('请输入商品名称');
                return;
            }

            if (editingProductId) {
                const product = products.find(p => p.id === editingProductId);
                product.name = name;
                product.price = price;
                product.desc = desc;
                product.image = currentImageData || product.image;
            } else {
                products.push({
                    id: Date.now(),
                    name,
                    price,
                    desc,
                    image: currentImageData
                });
            }

            closeProductModal();
            renderProducts();
            updateDashboard();
            saveProducts();
        }

        function editProduct(id) {
            openProductModal(id);
        }

        function deleteProduct(id) {
            if (confirm('确定要删除这个商品吗？')) {
                products = products.filter(p => p.id !== id);
                renderProducts();
                updateDashboard();
                saveProducts();
            }
        }

        function resetAll() {
            if (confirm('确定要重置所有数据吗？此操作不可恢复！')) {
                localStorage.removeItem('casino_chips');
                localStorage.removeItem('casino_items');
                localStorage.removeItem('casino_products');
                
                chips = JSON.parse(JSON.stringify(defaultChips));
                items = JSON.parse(JSON.stringify(defaultItems));
                products = [];
                
                renderChips();
                renderItems();
                renderProducts();
                updateDashboard();
            }
        }

        function exportAllData() {
            const data = {
                chips: chips,
                items: items,
                products: products,
                exportDate: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `casino_data_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showAutoSaveIndicator('数据已导出');
        }

        function importAllData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (data.chips) {
                        chips = data.chips;
                        localStorage.setItem('casino_chips', JSON.stringify(chips));
                    }
                    
                    if (data.items) {
                        items = data.items;
                        localStorage.setItem('casino_items', JSON.stringify(items));
                    }
                    
                    if (data.products) {
                        products = data.products;
                        localStorage.setItem('casino_products', JSON.stringify(products));
                    }
                    
                    renderChips();
                    renderItems();
                    renderProducts();
                    updateDashboard();
                    
                    alert('数据导入成功！');
                    showAutoSaveIndicator('数据已导入');
                } catch (error) {
                    alert('导入失败：文件格式错误');
                }
            };
            reader.readAsText(file);
            
            event.target.value = '';
        }

        loadData();
        renderChips();
        renderItems();
        renderProducts();
        updateDashboard();
    </script>
</body>
</html>
