<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11的娱乐游戏网站</title>
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <div id="mainSection">
        <div class="header">
            <div class="logo">11的娱乐游戏网站</div>
            <div class="nav">
                    <a class="nav-btn" href="home.html">主页面</a>
                    <a class="nav-btn" href="assets.html">我的资产</a>
                    <a class="nav-btn" href="shop.html">商店</a>
                    <a class="nav-btn" href="bank.html">银行</a>
                    <a class="nav-btn admin-only active" href="admin.html">管理后台</a>
                    <a class="nav-btn admin-only" href="users.html">用户管理</a>
                    <a class="nav-btn" href="wheel.html">幸运转盘</a>
                    <a class="nav-btn" href="games.html">游戏界面</a>
                </div>
            <div class="user-info">
                <span id="userBalance" class="user-badge">筹码: ¥0</span>
                <span id="userBadge" class="user-badge">玩家</span>
                <span id="currentUsername"></span>
                <button class="btn btn-danger" onclick="handleLogout()">退出</button>
            </div>
        </div>

        <div class="container">
            <div id="admin" class="page active">
                <div class="card">
                    <div class="card-title">奖励管理</div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <p style="color: #aaa; margin: 0;">管理所有可兑换的奖励</p>
                        <button class="btn btn-success" onclick="openAdminRewardModal()">添加奖励</button>
                    </div>
                    <div id="adminRewardsList"></div>
                </div>

                <div class="card">
                    <div class="card-title">惩罚管理</div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <p style="color: #aaa; margin: 0;">管理所有可消除的惩罚</p>
                        <button class="btn btn-danger" onclick="openAdminPenaltyModal()">添加惩罚</button>
                    </div>
                    <div id="adminPenaltiesList"></div>
                </div>

                <div class="card">
                    <div class="card-title">🏦 贷款配置管理</div>
                    <p style="color: #aaa; margin-bottom: 16px;">设置贷款上限、期限、利率等</p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 600px;">
                        <div class="form-group">
                            <label>贷款上限 (¥)</label>
                            <input type="number" id="loanCfgMaxAmount" placeholder="如: 10000">
                        </div>
                        <div class="form-group">
                            <label>最长期限 (天)</label>
                            <input type="number" id="loanCfgMaxTerm" placeholder="如: 30">
                        </div>
                        <div class="form-group">
                            <label>利率 (%)</label>
                            <input type="number" id="loanCfgInterestRate" placeholder="如: 5" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>逾期日罚息率 (%)</label>
                            <input type="number" id="loanCfgDailyPenalty" placeholder="如: 1" step="0.1">
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <button id="btnSaveLoanConfig" class="btn btn-primary" onclick="saveLoanConfig()">保存配置</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">🔌 银行开关</div>
                    <p style="color: #aaa; margin-bottom: 16px;">控制银行系统是否对玩家开放</p>
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <label style="position: relative; display: inline-block; width: 60px; height: 34px;">
                            <input type="checkbox" id="bankToggle" onchange="toggleBankStatus()" style="opacity: 0; width: 0; height: 0;">
                            <span id="bankToggleSlider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: 0.3s; border-radius: 34px;"></span>
                        </label>
                        <span id="bankToggleStatus" style="font-size: 16px; font-weight: bold; color: #aaa;"></span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">📋 所有贷款记录</div>
                    <div id="adminLoansList"></div>
                </div>
            </div>
        </div>

    <div class="modal" id="adminRewardModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="adminRewardModalTitle">添加奖励</h3>
                <button class="close-btn" onclick="closeAdminRewardModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>奖励名称</label>
                <input type="text" id="adminRewardName" placeholder="请输入奖励名称">
            </div>
            <div class="form-group">
                <label>奖励价格</label>
                <input type="number" id="adminRewardPrice" placeholder="请输入奖励价格">
            </div>
            <div class="form-group">
                <label>奖励描述</label>
                <textarea id="adminRewardDesc" rows="3" placeholder="请输入奖励描述"></textarea>
            </div>
            <div class="form-group">
                <label>奖励图片</label>
                <div class="image-upload-area" id="adminRewardImageArea" onclick="document.getElementById('adminRewardImage').click()">
                    <div id="adminRewardUploadPlaceholder">
                        <div style="font-size: 48px; margin-bottom: 10px;">📷</div>
                        <div>点击上传图片</div>
                    </div>
                    <img id="adminRewardImagePreview" style="display: none;">
                </div>
                <input type="file" id="adminRewardImage" accept="image/*" style="display: none;" onchange="handleAdminRewardImageUpload(event)">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="btnSaveAdminReward" class="btn btn-success" onclick="saveAdminReward()">保存</button>
                <button class="btn btn-danger" onclick="closeAdminRewardModal()">取消</button>
            </div>
        </div>
    </div>

    <div class="modal" id="adminPenaltyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="adminPenaltyModalTitle">添加惩罚</h3>
                <button class="close-btn" onclick="closeAdminPenaltyModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>惩罚名称</label>
                <input type="text" id="adminPenaltyName" placeholder="请输入惩罚名称">
            </div>
            <div class="form-group">
                <label>惩罚价格</label>
                <input type="number" id="adminPenaltyPrice" placeholder="请输入消除该惩罚的价格">
            </div>
            <div class="form-group">
                <label>惩罚描述</label>
                <textarea id="adminPenaltyDesc" rows="3" placeholder="请输入惩罚描述"></textarea>
            </div>
            <div class="form-group">
                <label>惩罚图片</label>
                <div class="image-upload-area" id="adminPenaltyImageArea" onclick="document.getElementById('adminPenaltyImage').click()">
                    <div id="adminPenaltyUploadPlaceholder">
                        <div style="font-size: 48px; margin-bottom: 10px;">📷</div>
                        <div>点击上传图片</div>
                    </div>
                    <img id="adminPenaltyImagePreview" style="display: none;">
                </div>
                <input type="file" id="adminPenaltyImage" accept="image/*" style="display: none;" onchange="handleAdminPenaltyImageUpload(event)">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="btnSaveAdminPenalty" class="btn btn-danger" onclick="saveAdminPenalty()">保存</button>
                <button class="btn btn-danger" onclick="closeAdminPenaltyModal()">取消</button>
            </div>
        </div>
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加商品</h3>
                <button class="close-btn" onclick="closeProductModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>商品名称</label>
                <input type="text" id="productName" placeholder="请输入商品名称">
            </div>
            <div class="form-group">
                <label>商品价格</label>
                <input type="number" id="productPrice" placeholder="请输入商品价格">
            </div>
            <div class="form-group">
                <label>商品描述</label>
                <textarea id="productDesc" rows="3" placeholder="请输入商品描述"></textarea>
            </div>
            <div class="form-group">
                <label>商品图片</label>
                <div class="image-upload-area" id="imageUploadArea" onclick="document.getElementById('productImage').click()">
                    <div id="uploadPlaceholder">
                        <div style="font-size: 48px; margin-bottom: 10px;">📷</div>
                        <div>点击上传图片</div>
                    </div>
                    <img id="imagePreview" style="display: none;">
                </div>
                <input type="file" id="productImage" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="btnSaveProduct" class="btn btn-primary" onclick="saveProduct()">保存</button>
                <button class="btn btn-danger" onclick="closeProductModal()">取消</button>
            </div>
        </div>
    </div>

    <div class="auto-save-indicator" id="autoSaveIndicator">
        💾 自动保存中...
    </div>
    </div>

    <script src="js/common.js?v=4"></script>
    <script src="js/admin.js?v=4"></script>
    <script src="js/bank.js?v=4"></script>
    <script src="js/loans.js?v=4"></script>
    <script>initAppPage(() => { if (currentUser && currentUser.role === 'admin') { loadAdminRewards(); loadAdminPenalties(); loadLoanConfig(); loadAdminBankStatus(); loadAdminLoans() } })</script>
</body>
</html>
