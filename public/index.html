<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="build-time" content="2026-09-13T21:30:00">
    <title>11的娱乐游戏网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: linear-gradient(90deg, #2d132c 0%, #801336 50%, #c72c41 100%);
            padding: 20px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #ffd700;
            color: #2d132c;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .admin-only {
            display: none;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: rgba(255, 215, 0, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #ffd700;
        }

        .user-badge.admin {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff4444;
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page {
            display: none;
            animation: fadeIn 0.5s;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }

        .stat-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #aaa;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #ffd700 0%, #ffed4e 100%);
            color: #2d132c;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-danger {
            background: linear-gradient(90deg, #c72c41 0%, #ee4545 100%);
            color: #fff;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(199, 44, 65, 0.4);
        }

        .btn-warning {
            background: linear-gradient(90deg, #e67e22, #f39c12);
            color: #fff;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4);
        }

        .btn-success {
            background: linear-gradient(90deg, #28a745 0%, #34ce57 100%);
            color: #fff;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th, table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        table th {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            font-weight: bold;
        }

        table tr:hover {
            background: rgba(255, 215, 0, 0.05);
        }

        table input {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        .item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
        }

        .item-card:hover {
            background: rgba(255, 215, 0, 0.05);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .item-desc {
            color: #aaa;
            font-size: 0.9em;
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .chip-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .chip-color {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin-right: 15px;
        }

        .chip-info {
            flex: 1;
        }

        .chip-name {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .chip-value {
            font-size: 14px;
            color: #aaa;
        }

        .chip-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chip-quantity input {
            width: 100px;
            padding: 8px;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-details {
            padding: 15px;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 24px;
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .product-actions .btn {
            flex: 1;
            padding: 8px;
            font-size: 14px;
        }

        .game-placeholder {
            text-align: center;
            padding: 100px 20px;
        }

        .game-placeholder .icon {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .game-placeholder h2 {
            font-size: 36px;
            color: #ffd700;
            margin-bottom: 20px;
        }

        .game-placeholder p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid #ffd700;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .modal-header h3 {
            color: #ffd700;
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-btn:hover {
            color: #c72c41;
            transform: rotate(90deg);
        }

        .image-upload-area {
            border: 2px dashed rgba(255, 215, 0, 0.5);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .image-upload-area:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        /* 开关样式 */
        #bankToggle:checked + #bankToggleSlider {
            background-color: #28a745;
        }
        #bankToggle:checked + #bankToggleSlider::before {
            transform: translateX(26px);
        }
        #bankToggleSlider::before {
            content: "";
            position: absolute;
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        #bank .bank-disabled .loan-section {
            opacity: 0.4;
            pointer-events: none;
        }

        .image-upload-area img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        .total-bar {
            background: linear-gradient(90deg, #2d132c 0%, #801336 100%);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #ffd700;
        }

        .total-bar .total-label {
            font-size: 20px;
            color: #ffd700;
        }

        .total-bar .total-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
        }

        .save-status {
            color: #28a745;
            line-height: 44px;
            display: none;
            animation: fadeInOut 2s ease-in-out;
        }

        .save-status.show {
            display: inline-block;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .auto-save-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(40, 167, 69, 0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            animation: slideIn 0.3s ease-out;
            z-index: 999;
        }

        .auto-save-indicator.show {
            display: block;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .auth-container {
            max-width: 500px;
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 40px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-container h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .auth-tab {
            flex: 1;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: #ffd700;
            color: #2d132c;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .player-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .player-name {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
        }

        .player-role {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .player-role.admin {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .player-role.player {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }

        .player-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .player-stat {
            text-align: center;
        }

        .player-stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }

        .player-stat-label {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }

        .purchase-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #ffd700;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="authSection">
        <div class="auth-container">
            <h2>11的娱乐游戏网站</h2>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showAuthTab('login')">登录</button>
                <button class="auth-tab" onclick="showAuthTab('register')">注册</button>
            </div>
            
            <div id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                </div>
                <button id="btnLogin" class="btn btn-primary" style="width: 100%;" onclick="handleLogin()">登录</button>
                <div id="loginError" class="error-message"></div>
            </div>

            <div id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="registerUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="registerPassword" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="registerConfirmPassword" placeholder="请再次输入密码">
                </div>
                <button id="btnRegister" class="btn btn-success" style="width: 100%;" onclick="handleRegister()">注册</button>
                <div id="registerError" class="error-message"></div>
            </div>
        </div>
    </div>

    <div id="mainSection" style="display: none;">
        <div class="header">
            <div class="logo">11的娱乐游戏网站</div>
            <div class="nav">
                <button class="nav-btn" onclick="showPage('home')">主页面</button>
                <button class="nav-btn" onclick="showPage('assets')">我的资产</button>
                <button class="nav-btn" onclick="showPage('shop')">商店</button>
                <button class="nav-btn" onclick="showPage('bank')">银行</button>
                <button class="nav-btn admin-only" onclick="showPage('admin')">管理后台</button>
                <button class="nav-btn admin-only" onclick="showPage('users')">用户管理</button>
                <button class="nav-btn" onclick="showPage('games')">游戏界面</button>
            </div>
            <div class="user-info">
                <span id="userBalance" class="user-badge">余额: ¥0</span>
                <span id="userBadge" class="user-badge">玩家</span>
                <span id="currentUsername"></span>
                <button class="btn btn-danger" onclick="handleLogout()">退出</button>
            </div>
        </div>

        <div class="container">
<!-- page:home will be loaded dynamically -->
<!-- page:assets will be loaded dynamically -->
<!-- page:shop will be loaded dynamically -->
<!-- page:bank will be loaded dynamically -->
<!-- page:admin will be loaded dynamically -->
<!-- page:users will be loaded dynamically -->
<!-- page:games will be loaded dynamically -->
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加商品</h3>
                <button class="close-btn" onclick="closeProductModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>商品名称</label>
                <input type="text" id="productName" placeholder="请输入商品名称">
            </div>
            <div class="form-group">
                <label>商品价格</label>
                <input type="number" id="productPrice" placeholder="请输入商品价格">
            </div>
            <div class="form-group">
                <label>商品描述</label>
                <textarea id="productDesc" rows="3" placeholder="请输入商品描述"></textarea>
            </div>
            <div class="form-group">
                <label>商品图片</label>
                <div class="image-upload-area" id="imageUploadArea" onclick="document.getElementById('productImage').click()">
                    <div id="uploadPlaceholder">
                        <div style="font-size: 48px; margin-bottom: 10px;">📷</div>
                        <div>点击上传图片</div>
                    </div>
                    <img id="imagePreview" style="display: none;">
                </div>
                <input type="file" id="productImage" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="btnSaveProduct" class="btn btn-primary" onclick="saveProduct()">保存</button>
                <button class="btn btn-danger" onclick="closeProductModal()">取消</button>
            </div>
        </div>
    </div>

    <div class="modal" id="userBalanceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>修改用户余额</h3>
                <button class="close-btn" onclick="closeUserBalanceModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="balanceUsername" readonly>
            </div>
            <div class="form-group">
                <label>新余额</label>
                <input type="number" id="newBalance" placeholder="请输入新余额">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="btnUpdateBalance" class="btn btn-primary" onclick="updateUserBalance()">保存</button>
                <button class="btn btn-danger" onclick="closeUserBalanceModal()">取消</button>
            </div>
        </div>
    </div>

    <div class="modal" id="assetModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="assetModalTitle">添加资产</h3>
                <button class="close-btn" onclick="closeAssetModal()">&times;</button>

        function showAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'))
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'))
            
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active')
                document.getElementById('loginForm').classList.add('active')
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active')
                document.getElementById('registerForm').classList.add('active')
            }
        }

        async function handleLogin() {
            const btn = document.getElementById('btnLogin')
            if (btn.disabled) return
            lockBtn(btn)
            const username = document.getElementById('loginUsername').value
            const password = document.getElementById('loginPassword').value
            const errorDiv = document.getElementById('loginError')

            if (!username || !password) {
                errorDiv.textContent = '用户名和密码不能为空'
                errorDiv.classList.add('show')
                unlockBtn(btn)
                return
            }

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                })

                const data = await response.json()

                if (data.success) {
                    localStorage.setItem('token', data.token)
                    localStorage.setItem('user', JSON.stringify(data.user))
                    currentUser = data.user
                    showMainApp()
                } else {
                    errorDiv.textContent = data.error
                    errorDiv.classList.add('show')
                    unlockBtn(btn)
                }
            } catch (error) {
                errorDiv.textContent = '登录失败，请检查网络连接'
                errorDiv.classList.add('show')
                unlockBtn(btn)
            }
        }

        async function handleRegister() {
            const btn = document.getElementById('btnRegister')
            if (btn.disabled) return
            lockBtn(btn)
            const username = document.getElementById('registerUsername').value
            const password = document.getElementById('registerPassword').value
            const confirmPassword = document.getElementById('registerConfirmPassword').value
            const errorDiv = document.getElementById('registerError')

            if (!username || !password) {
                errorDiv.textContent = '用户名和密码不能为空'
                errorDiv.classList.add('show')
                unlockBtn(btn)
                return
            }

            if (password !== confirmPassword) {
                errorDiv.textContent = '两次输入的密码不一致'
                errorDiv.classList.add('show')
                unlockBtn(btn)
                return
            }

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role: 'player' })
                })

                const data = await response.json()

                if (data.success) {
                    localStorage.setItem('token', data.token)
                    localStorage.setItem('user', JSON.stringify(data.user))
                    currentUser = data.user
                    showMainApp()
                } else {
                    errorDiv.textContent = data.error
                    errorDiv.classList.add('show')
                    unlockBtn(btn)
                }
            } catch (error) {
                errorDiv.textContent = '注册失败，请检查网络连接'
                errorDiv.classList.add('show')
                unlockBtn(btn)
            }
        }

        function handleLogout() {
            localStorage.removeItem('token')

                reader.onerror = reject

            })
        }

        // === 北京时间格式化 ===
        function toBeijingTime(dateStr) {
            if (!dateStr) return ''
            try {
                // SQLite 返回的 datetime 不带时区标记（如 "2026-09-13 16:17:46"），视为 UTC
                const d = new Date(dateStr.includes('T') ? dateStr : dateStr.replace(' ', 'T') + 'Z')
                if (isNaN(d.getTime())) return dateStr
                // 使用 toLocaleString 指定 Asia/Shanghai 时区（北京时间）
                return d.toLocaleString('zh-CN', {
                    timeZone: 'Asia/Shanghai',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).replace(/\//g, '-')
            } catch (e) {
                return dateStr
            }
        }

        function showPage(pageId) {

            let pageEl = document.getElementById(pageId)
            if (!pageEl && PAGE_CONTENT[pageId]) {
                const temp = document.createElement('div')
                temp.innerHTML = PAGE_CONTENT[pageId]
                pageEl = temp.firstElementChild
                if (pageEl && pageEl.id === pageId) {
                    container.appendChild(pageEl)
                }
            }
            
            if (!pageEl) return
            
            // Apply admin visibility to newly loaded page
            if (currentUser) {
                pageEl.querySelectorAll('.admin-only').forEach(el => {
                    el.style.display = currentUser.role === 'admin' ? 'block' : 'none'
                })
            }
            
            // Hide all pages, show selected
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'))
            pageEl.classList.add('active')
            
            // Mark the active nav button
            document.querySelectorAll('.nav-btn').forEach(b => {
                if (b.textContent.trim() === pageId || b.getAttribute('onclick')?.includes(pageId)) {
                    b.classList.add('active')
                }
            })

            if (pageId === 'shop') {
                loadShop()
            }
            if (pageId === 'assets') {
                loadUserAssets()
            }
            if (pageId === 'bank') {
                loadBank()
            }
            if (pageId === 'admin' && currentUser && currentUser.role === 'admin') {
                loadAdminRewards()
                loadAdminPenalties()
                loadLoanConfig()
                loadAdminBankStatus()
                loadAdminLoans()
            }

                loadUsers()
            }
        }

                document.getElementById('modalTitle').textContent = '编辑商品'
                document.getElementById('productName').value = product.name
                document.getElementById('productPrice').value = product.price
                document.getElementById('productDesc').value = product.description || ''

                    currentImageData = product.image

                    document.getElementById('imagePreview').style.display = 'block'
                    document.getElementById('uploadPlaceholder').style.display = 'none'
                }
            } else {
                document.getElementById('modalTitle').textContent = '添加商品'

                document.getElementById('productPrice').value = ''
                document.getElementById('productDesc').value = ''

        function handleImageUpload(event) {
            const file = event.target.files[0]
            if (file) {
                const reader = new FileReader()
                reader.onload = function(e) {
                    currentImageData = e.target.result
                    document.getElementById('imagePreview').src = currentImageData
                    document.getElementById('imagePreview').style.display = 'block'
                    document.getElementById('uploadPlaceholder').style.display = 'none'
                }
                reader.readAsDataURL(file)
            }
        }

                const response = await fetch(`${API_BASE}/products/list`)
                const data = await response.json()
                if (data.success && data.data.length > 0) {
                    container.innerHTML = data.data.map(product => `
                        <div class="product-card" style="display: flex; flex-direction: column;">
                            ${product.image ? `<img src="${product.image}" alt="${product.name}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px; margin-bottom: 10px;">` : '<div style="height: 150px; background: #1a1a2e; display: flex; align-items: center; justify-content: center; font-size: 48px; border-radius: 6px; margin-bottom: 10px;">📦</div>'}
                            <div class="product-info" style="flex: 1;">
                                <div class="product-name" style="font-size: 16px; font-weight: 600;">${product.name}</div>
                                <div class="product-price" style="color: #ffd700; font-size: 14px; margin: 4px 0;">¥${product.price}</div>
                                ${product.description ? `<div class="product-desc" style="font-size: 12px; color: #aaa; margin-bottom: 8px;">${product.description}</div>` : ''}
                            </div>
                            <button id="btnPurchase_${product.id}" class="btn btn-primary purchase-btn" onclick="purchaseProduct(${product.id})" style="margin-top: auto; width: 100%;">立即购买</button>
                        </div>
                    `).join('')
                } else {
                    container.innerHTML = '<p style="color: #aaa; text-align: center; padding: 20px;">暂无上架商品</p>'
                }
            } catch (error) {
                container.innerHTML = '<p style="color: #ff4444; text-align: center; padding: 20px;">加载失败</p>'
            }
        }

        async function purchaseProduct(productId) {
            const token = localStorage.getItem('token')
            if (!token) { alert('请先登录'); return }
            const btn = document.getElementById(`btnPurchase_${productId}`)
            if (!btn || btn.disabled) return
            btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'
            try {
                const response = await fetch(`${API_BASE}/products/purchase`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ productId })
                })
                const data = await response.json()
                if (data.success) {
                    showAutoIndicator(data.message)
                    const user = JSON.parse(localStorage.getItem('user') || '{}')
                    user.balance = data.balance
                    localStorage.setItem('user', JSON.stringify(user))
                    updateBalance(data.balance)
                    loadShopProducts()
                    loadHomePage()
                } else {
                    alert(data.error)
                    btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'
                }
            } catch (error) {
                alert('购买失败：' + error.message)
                btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'
            }
        }

        // ==================== 银行/贷款页面 ====================
        async function loadBank() {
            // 先检查银行状态
            try {
                const statusRes = await fetch(`${API_BASE}/bank/status`)
                const statusData = await statusRes.json()
                const bankOpen = statusData.bank_open === true
                updateBankStatusUI(bankOpen)
            } catch (e) {
                console.error('Failed to check bank status:', e)
            }

            await Promise.all([
                loadLoanConfig(),
                loadMyLoans()
            ])
            // 更新银行页统计
            try {
                const token = localStorage.getItem('token')
                const response = await fetch(`${API_BASE}/user/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                const data = await response.json()
                if (data) {
                    document.getElementById('bankBalanceStat').textContent = `¥${data.balance || 0}`
                }
            } catch (e) {}
        }

        function updateBankStatusUI(bankOpen) {
            const banner = document.getElementById('bankStatusBanner')
            const bankPage = document.getElementById('bank')
            if (!bankOpen) {
                banner.style.display = 'block'
                banner.style.background = 'rgba(255, 68, 68, 0.15)'
                banner.style.border = '1px solid #ff4444'
                banner.style.color = '#ff4444'
                banner.textContent = '🔒 银行目前关闭中，无法申请贷款'
                bankPage.classList.add('bank-disabled')
            } else {
                banner.style.display = 'block'
                banner.style.background = 'rgba(40, 167, 69, 0.15)'
                banner.style.border = '1px solid #28a745'
                banner.style.color = '#28a745'
                banner.textContent = '✅ 银行正常开放'
                bankPage.classList.remove('bank-disabled')
            }
            // 更新管理员面板的开关
            const toggle = document.getElementById('bankToggle')
            const statusLabel = document.getElementById('bankToggleStatus')
            if (toggle) {
                toggle.checked = bankOpen
                statusLabel.textContent = bankOpen ? '🟢 营业中' : '🔴 已关闭'
                statusLabel.style.color = bankOpen ? '#28a745' : '#ff4444'
            }
        }

        async function toggleBankStatus() {
            const toggle = document.getElementById('bankToggle')
            const token = localStorage.getItem('token')
            const bankOpen = toggle.checked
            try {
                const res = await fetch(`${API_BASE}/admin/bank/toggle`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ bank_open: bankOpen })
                })
                const data = await res.json()
                if (data.success) {
                    showAutoIndicator(bankOpen ? '银行已开启' : '银行已关闭')
                    updateBankStatusUI(data.bank_open)
                } else {
                    alert(data.error)
                    toggle.checked = !bankOpen
                }
            } catch (error) {
                alert('操作失败：' + error.message)
                toggle.checked = !bankOpen
            }
        }

        async function loadAdminBankStatus() {
            try {
                const res = await fetch(`${API_BASE}/bank/status`)
                const data = await res.json()
                if (data.success !== undefined) {
                    updateBankStatusUI(data.bank_open === true)
                }
            } catch (e) {
                console.error('Failed to load admin bank status:', e)
            }
        }

        async function loadLoanConfig() {
            try {
                const response = await fetch(`${API_BASE}/loans/config`)
                const data = await response.json()
                if (data.success && data.data) {
                    const cfg = data.data
                    // 银行页面显示
                    const displayDiv = document.getElementById('loanConfigDisplay')
                    if (displayDiv) {
                        displayDiv.innerHTML = `
                            <div style="background: #16213e; padding: 12px; border-radius: 6px; text-align: center;">
                                <div style="font-size: 24px; color: #ffd700;">¥${cfg.max_amount || 0}</div>
                                <div style="font-size: 12px; color: #aaa;">贷款上限</div>
                            </div>
                            <div style="background: #16213e; padding: 12px; border-radius: 6px; text-align: center;">
                                <div style="font-size: 24px; color: #4fc3f7;">${cfg.max_term_days || 0}天</div>
                                <div style="font-size: 12px; color: #aaa;">最长期限</div>
                            </div>
                            <div style="background: #16213e; padding: 12px; border-radius: 6px; text-align: center;">
                                <div style="font-size: 24px; color: #81c784;">${cfg.interest_rate || 0}%</div>
                                <div style="font-size: 12px; color: #aaa;">利率</div>
                            </div>
                            <div style="background: #16213e; padding: 12px; border-radius: 6px; text-align: center;">
                                <div style="font-size: 24px; color: #ff8a65;">${cfg.daily_penalty_rate || 0}%</div>
                                <div style="font-size: 12px; color: #aaa;">逾期日罚息</div>
                            </div>
                        `
                    }
                    // 管理后台表单填充
                    if (document.getElementById('loanCfgMaxAmount')) {
                        document.getElementById('loanCfgMaxAmount').value = cfg.max_amount || ''
                        document.getElementById('loanCfgMaxTerm').value = cfg.max_term_days || ''
                        document.getElementById('loanCfgInterestRate').value = cfg.interest_rate || ''
                        document.getElementById('loanCfgDailyPenalty').value = cfg.daily_penalty_rate || ''
                    }
                    return cfg
                }
            } catch (error) {
                console.error('Failed to load loan config:', error)
            }
            return null
        }

        async function saveLoanConfig() {
            const btn = document.getElementById('btnSaveLoanConfig')
            if (btn.disabled) return
            lockBtn(btn)
            const max_amount = parseFloat(document.getElementById('loanCfgMaxAmount').value)
            const max_term_days = parseInt(document.getElementById('loanCfgMaxTerm').value)
            const interest_rate = parseFloat(document.getElementById('loanCfgInterestRate').value)
            const daily_penalty_rate = parseFloat(document.getElementById('loanCfgDailyPenalty').value)
            const token = localStorage.getItem('token')

            if (!max_amount || !max_term_days || isNaN(interest_rate)) {
                alert('请填写完整的配置信息')
                unlockBtn(btn); return
            }

            try {
                const response = await fetch(`${API_BASE}/loans/config`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ max_amount, max_term_days, interest_rate, daily_penalty_rate: daily_penalty_rate || 0 })
                })
                const data = await response.json()
                if (data.success) {
                    showAutoIndicator('贷款配置已更新')
                    loadLoanConfig()
                } else {
                    alert(data.error)
                }
            } catch (error) {
                alert('保存失败：' + error.message)
            } finally {
                unlockBtn(btn)
            }
        }

        async function applyLoan() {
            const btn = document.getElementById('btnApplyLoan')
            if (btn.disabled) return
            lockBtn(btn)
            const token = localStorage.getItem('token')
            if (!token) { alert('请先登录'); unlockBtn(btn); return }

            // 本地检查银行状态
            const bankPage = document.getElementById('bank')
            if (bankPage.classList.contains('bank-disabled')) {
                document.getElementById('loanResult').innerHTML = '<p style="color: #ff4444;">❌ 银行目前已关闭，无法申请贷款</p>'
                unlockBtn(btn); return
            }

            const amount = parseFloat(document.getElementById('loanAmount').value)
            const termDays = parseInt(document.getElementById('loanTermDays').value)
            const resultDiv = document.getElementById('loanResult')

            if (!amount || amount <= 0) {
                resultDiv.innerHTML = '<p style="color: #ff4444;">请输入有效的贷款金额</p>'
                unlockBtn(btn); return
            }
            if (!termDays || termDays <= 0) {
                resultDiv.innerHTML = '<p style="color: #ff4444;">请输入有效的贷款期限</p>'
                unlockBtn(btn); return
            }

            try {
                const response = await fetch(`${API_BASE}/loans/apply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ amount, termDays })
                })
                const data = await response.json()
                if (data.success) {
                    resultDiv.innerHTML = `<p style="color: #28a745;">✅ ${data.message}，到账 ¥${amount}</p>`
                    document.getElementById('loanAmount').value = ''
                    document.getElementById('loanTermDays').value = ''
                    updateBalance(data.balance)
                    loadMyLoans()
                    loadBank()
                } else {
                    resultDiv.innerHTML = `<p style="color: #ff4444;">❌ ${data.error}</p>`
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: #ff4444;">❌ 申请失败：${error.message}</p>`
            } finally {
                unlockBtn(btn)
            }
        }

        async function loadMyLoans() {
            const token = localStorage.getItem('token')
            if (!token) return
            const container = document.getElementById('myLoansList')
            try {
                const response = await fetch(`${API_BASE}/loans/list`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                const data = await response.json()
                if (data.success) {
                    const loans = data.data || []
                    // 更新统计
                    const activeLoans = loans.filter(l => l.status === 'active')
                    const remainingTotal = activeLoans.reduce((sum, l) => sum + l.remaining, 0)
                    document.getElementById('bankTotalLoans').textContent = loans.length
                    document.getElementById('bankActiveLoans').textContent = activeLoans.length
                    document.getElementById('bankRemainingDebt').textContent = `¥${remainingTotal}`

                    if (loans.length === 0) {
                        container.innerHTML = '<p style="color: #aaa; text-align: center; padding: 20px;">暂无贷款记录</p>'
                        return
                    }

                    container.innerHTML = `<div style="overflow-x: auto;"><table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                        <thead>
                            <tr style="background: #1a1a2e;">
                                <th style="padding: 10px 8px; text-align: left; color: #aaa;">金额</th>
                                <th style="padding: 10px 8px; text-align: left; color: #aaa;">利率</th>
                                <th style="padding: 10px 8px; text-align: left; color: #aaa;">期限</th>
                                <th style="padding: 10px 8px; text-align: left; color: #aaa;">应还总额</th>
                                <th style="padding: 10px 8px; text-align: left; color: #aaa;">剩余欠款</th>
                                <th style="padding: 10px 8px; text-align: left; color: #aaa;">到期日</th>
                                <th style="padding: 10px 8px; text-align: left; color: #aaa;">状态</th>
                                <th style="padding: 10px 8px; text-align: left; color: #aaa;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${loans.map(loan => {
                                const dueDate = new Date(loan.due_date)
                                const now = new Date()
                                const isOverdue = now > dueDate && loan.status === 'active'
                                const statusText = loan.status === 'active' ? (isOverdue ? '⚠️ 逾期' : '✅ 进行中') : (loan.status === 'repaid' ? '✅ 已还清' : '📋 已结清')
                                const statusColor = loan.status === 'active' ? (isOverdue ? '#ff4444' : '#4fc3f7') : '#81c784'
                                return `<tr style="border-bottom: 1px solid #333;">
                                    <td style="padding: 10px 8px;">¥${loan.amount}</td>
                                    <td style="padding: 10px 8px;">${loan.interest_rate}%</td>
                                    <td style="padding: 10px 8px;">${loan.term_days}天</td>
                                    <td style="padding: 10px 8px; color: #ffd700;">¥${loan.total_repay}</td>
                                    <td style="padding: 10px 8px; color: ${loan.status === 'active' ? '#ff6b6b' : '#81c784'};">¥${loan.remaining}</td>
                                    <td style="padding: 10px 8px;">${loan.due_date}</td>
                                    <td style="padding: 10px 8px; color: ${statusColor};">${statusText}</td>
                                    <td style="padding: 10px 8px;">
                                        ${loan.status === 'active' ? `
                                            <button class="btn btn-primary" style="padding: 4px 10px; font-size: 12px;" onclick="repayLoan(${loan.id})">还款</button>
                                            <button class="btn btn-success" style="padding: 4px 10px; font-size: 12px;" onclick="repayFullLoan(${loan.id})">还清</button>
                                        ` : ''}
                                    </td>
                                </tr>`
                            }).join('')}
                        </tbody>
                    </table></div>`
                }
            } catch (error) {
                container.innerHTML = '<p style="color: #ff4444; text-align: center; padding: 20px;">加载失败</p>'
            }
        }

        async function repayLoan(loanId) {
            const token = localStorage.getItem('token')
            if (!token) return
            const amount = prompt('请输入还款金额：')
            if (!amount || isNaN(amount) || parseFloat(amount) <= 0) return
            try {
                const response = await fetch(`${API_BASE}/loans/repay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ loanId, amount: parseFloat(amount) })
                })
                const data = await response.json()
                if (data.success) {
                    showAutoIndicator(data.message)
                    updateBalance(data.balance)
                    loadMyLoans()
                    loadBank()
                } else {
                    alert(data.error)
                }
            } catch (error) {
                alert('还款失败：' + error.message)
            }
        }

        async function repayFullLoan(loanId) {
            const token = localStorage.getItem('token')
            if (!token) return
            if (!confirm('确定要一次性还清这笔贷款吗？')) return
            try {
                const response = await fetch(`${API_BASE}/loans/repay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ loanId })
                })
                const data = await response.json()
                if (data.success) {
                    showAutoIndicator(data.message)
                    updateBalance(data.balance)
                    loadMyLoans()
                    loadBank()
                } else {
                    alert(data.error)
                }
            } catch (error) {
                alert('还款失败：' + error.message)
            }
        }

        // ==================== 管理员 - 贷款管理 ====================
        async function loadAdminLoans() {
            const token = localStorage.getItem('token')
            const container = document.getElementById('adminLoansList')
            if (!container) return
            try {
                const response = await fetch(`${API_BASE}/loans/all`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                const data = await response.json()
                if (data.success) {
                    const loans = data.data || []
                    if (loans.length === 0) {
                        container.innerHTML = '<p style="color: #aaa; text-align: center; padding: 20px;">暂无贷款记录</p>'
                        return
                    }
                    container.innerHTML = `<div style="overflow-x: auto;"><table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                        <thead>
                            <tr style="background: #1a1a2e;">
                                <th style="padding: 8px 6px; text-align: left; color: #aaa;">用户</th>
                                <th style="padding: 8px 6px; text-align: left; color: #aaa;">金额</th>
                                <th style="padding: 8px 6px; text-align: left; color: #aaa;">利率</th>
                                <th style="padding: 8px 6px; text-align: left; color: #aaa;">应还</th>
                                <th style="padding: 8px 6px; text-align: left; color: #aaa;">剩余</th>
                                <th style="padding: 8px 6px; text-align: left; color: #aaa;">到期日</th>
                                <th style="padding: 8px 6px; text-align: left; color: #aaa;">状态</th>
                                <th style="padding: 8px 6px; text-align: left; color: #aaa;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${loans.map(loan => {
                                const statusText = loan.status === 'active' ? '进行中' : (loan.status === 'repaid' ? '已还清' : '已结清')
                                return `<tr style="border-bottom: 1px solid #333;">
                                    <td style="padding: 8px 6px; color: #4fc3f7;">${loan.username}</td>
                                    <td style="padding: 8px 6px;">¥${loan.amount}</td>
                                    <td style="padding: 8px 6px;">${loan.interest_rate}%</td>
                                    <td style="padding: 8px 6px; color: #ffd700;">¥${loan.total_repay}</td>
                                    <td style="padding: 8px 6px; color: ${loan.status === 'active' ? '#ff6b6b' : '#81c784'};">¥${loan.remaining}</td>
                                    <td style="padding: 8px 6px;">${loan.due_date}</td>
                                    <td style="padding: 8px 6px; color: ${loan.status === 'active' ? '#ffd700' : '#81c784'};">${statusText}</td>
                                    <td style="padding: 8px 6px;">
                                        ${loan.status === 'active' ? `<button class="btn btn-warning" style="padding: 2px 8px; font-size: 11px;" onclick="settleLoan(${loan.id})">结清</button>` : '-'}
                                    </td>
                                </tr>`
                            }).join('')}
                        </tbody>
                    </table></div>`
                }
            } catch (error) {
                console.error('Failed to load admin loans:', error)
            }
        }

        async function settleLoan(loanId) {
            const token = localStorage.getItem('token')
            if (!confirm('确定要强制结清这笔贷款吗？')) return
            try {
                const response = await fetch(`${API_BASE}/loans/settle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ loanId })
                })
                const data = await response.json()
                if (data.success) {
                    showAutoIndicator(data.message)
                    loadAdminLoans()
                } else {
                    alert(data.error)
                }
            } catch (error) {
                alert('操作失败：' + error.message)
            }
        }

        function updateBalance(newBalance) {
            document.querySelectorAll('[id$="BalanceStat"], [id="userBalance"]').forEach(el => {
                if (el.id === 'userBalance') {
                    el.textContent = `余额: ¥${newBalance || 0}`
                } else {
                    el.textContent = `¥${newBalance || 0}`
                }
            })
        }

        checkAuth()
    </script>
</body>
</html>
