<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11的娱乐游戏网站</title>
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <div id="mainSection">
        <div class="header">
            <div class="logo">11的娱乐游戏网站</div>
            <div class="nav">
                    <a class="nav-btn" href="home.html">主页面</a>
                    <a class="nav-btn" href="assets.html">我的资产</a>
                    <a class="nav-btn" href="shop.html">商店</a>
                    <a class="nav-btn active" href="bank.html">银行</a>
                    <a class="nav-btn admin-only" href="admin.html">管理后台</a>
                    <a class="nav-btn admin-only" href="users.html">用户管理</a>
                    <a class="nav-btn" href="wheel.html">幸运转盘</a>
                    <a class="nav-btn" href="games.html">游戏界面</a>
                </div>
            <div class="user-info">
                <span id="userBalance" class="user-badge">筹码: ¥0</span>
                <span id="userBadge" class="user-badge">玩家</span>
                <span id="currentUsername"></span>
                <button class="btn btn-danger" onclick="handleLogout()">退出</button>
            </div>
        </div>

        <div class="container">
            <div id="bank" class="page active">
                <div id="bankStatusBanner" style="padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: none; font-weight: bold; text-align: center; font-size: 16px;"></div>
                <div class="stats-grid" style="margin-bottom: 20px;">
                    <div class="stat-card">
                        <div class="stat-icon">💰</div>
                        <div class="stat-value" id="bankBalanceStat">¥0</div>
                        <div class="stat-label">我的筹码</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📋</div>
                        <div class="stat-value" id="bankTotalLoans">0</div>
                        <div class="stat-label">贷款次数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⚠️</div>
                        <div class="stat-value" id="bankActiveLoans">0</div>
                        <div class="stat-label">未还贷款</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">💸</div>
                        <div class="stat-value" id="bankRemainingDebt">¥0</div>
                        <div class="stat-label">剩余欠款</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">🏦 贷款信息</div>
                    <div id="loanConfigDisplay" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 16px; background: #1a1a2e; border-radius: 8px;"></div>
                </div>

                <div class="card">
                    <div class="card-title">📝 申请贷款</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 500px;">
                        <div class="form-group">
                            <label>贷款金额 (¥)</label>
                            <input type="number" id="loanAmount" placeholder="输入金额" min="1">
                        </div>
                        <div class="form-group">
                            <label>贷款期限 (天)</label>
                            <input type="number" id="loanTermDays" placeholder="输入天数" min="1">
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <button id="btnApplyLoan" class="btn btn-primary" onclick="applyLoan()" style="width: 100%;">申请贷款</button>
                            <div id="loanResult" style="margin-top: 8px;"></div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">📋 我的贷款记录</div>
                    <div id="myLoansList"></div>
                </div>
            </div>
        </div>

    <div class="auto-save-indicator" id="autoSaveIndicator">
        💾 自动保存中...
    </div>
    </div>

    <script src="js/common.js?v=4"></script>
    <script src="js/bank.js?v=4"></script>
    <script>initAppPage(loadBank)</script>
</body>
</html>
